# Configuración de despliegue en Netlify para Next.js (App Router).
# El runtime oficial @netlify/plugin-nextjs gestiona SSR, server actions y rutas dinámicas.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
